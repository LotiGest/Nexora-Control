name: Nexora commercial checks
on:
  push:
    branches: [feature/commercial-catalog-20261127]
  pull_request:
    paths:
      - 'commercial*.js'
      - 'finance*.js'
      - 'worker/nexora-finanzas/**'
      - 'worker/nexora-provision/**'
      - 'tests/finance.test.mjs'
      - 'project-status*.js'
      - 'tests/project-status.test.mjs'
      - 'commercial.css'
      - 'index.html'
      - 'tests/commercial.test.mjs'
      - 'tests/commercial-company.test.mjs'
      - 'tests/commercial-reference-rates.test.mjs'
      - 'tests/commercial-trials.test.mjs'
      - 'tests/commercial-billing.test.mjs'
      - 'docs/firestore-commercial-snippet.rules'
      - '.github/workflows/nexora-commercial-checks.yml'
permissions:
  contents: read
jobs:
  commercial:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check commercial-core.js && node --check commercial.js && node --check commercial-company-core.js && node --check commercial-companies.js && node --check project-status.js && node --check project-status-core.js && node --check commercial-billing.js && node --check commercial-billing-core.js && node --check commercial-reference-rates.js && node --check commercial-trials-core.js && node --check commercial-trials.js && node --check finance-core.js && node --check finance-ui.js && node --check worker/nexora-finanzas/src/index.js && node --check worker/nexora-provision/src/plan.js && node --check worker/nexora-provision/src/qa-d1.js && node --check worker/nexora-provision/src/initial-access.js && node --check worker/nexora-provision/qa-auth/index.js && node --check worker/nexora-provision/qa-auth/page.js
      - run: node --test tests/*.test.mjs worker/nexora-licencias/tests/*.test.mjs worker/nexora-finanzas/tests/*.test.mjs worker/nexora-provision/tests/*.test.mjs
