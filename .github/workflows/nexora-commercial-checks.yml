name: Nexora commercial checks
on:
  push:
    branches: [feature/commercial-catalog-20261127]
  pull_request:
    paths:
      - 'commercial*.js'
      - 'commercial.css'
      - 'index.html'
      - 'tests/commercial.test.mjs'
      - 'docs/firestore-commercial-snippet.rules'
      - '.github/workflows/nexora-commercial-checks.yml'
permissions:
  contents: read
jobs:
  commercial:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check commercial-core.js && node --check commercial.js
      - run: node --test tests/*.test.mjs worker/nexora-licencias/tests/*.test.mjs
