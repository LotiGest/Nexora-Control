name: Temporary Nexora-to-SIAC asymmetric QA handshake
on:
  push:
    paths:
      - ".github/workflows/nexora-qa-ecdsa-handshake.yml"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify cross-account P-256 signature through isolated SIAC QA
        run: |
          node --input-type=module <<'NODE'
          const endpoint='https://nexora-licencias.lotigestnexora.workers.dev/__qa_probe';
          const controller=new AbortController();
          const timer=setTimeout(()=>controller.abort(),20000);
          try{
            const response=await fetch(endpoint,{redirect:'manual',signal:controller.signal});
            const data=await response.json();
            console.log('Handshake status:',response.status,'qaConnected:',data.qaConnected,'environment:',data.environment,'error:',data.error||'none');
            if(response.status!==200||data.qaConnected!==true||data.environment!=='qa'||data.readOnly!==true){
              process.exitCode=1;
            }
          }catch(e){
            console.error('Handshake request failed:',e.message);process.exitCode=1;
          }finally{clearTimeout(timer)}
          NODE
